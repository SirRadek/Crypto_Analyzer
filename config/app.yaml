core:
  symbol: BTCUSDC
  interval: 5m
  forward_steps: 8
  history_days: 365
  timezone: UTC

database:
  price_store: data/crypto_data.sqlite
  url: null
  predictions_table: predictions
  onchain_table: onchain_1d
  feature_store: null
  read_chunksize: 100000
  pool_size: 5
  max_overflow: 10

runtime:
  cpu_limit: auto
  repeat_count: 50
  log_level: INFO
  data_dir: data
  cache_dir: data/cache
  tmp_dir: data/tmp
  binance_interval_minutes: 15
  orderbook_interval_minutes: 1

features:
  include_onchain: true
  include_orderbook: false
  include_derivatives: true
  include_sentiment: false
  forward_fill_limit: 12
  fillna_value: 0.0

live:
  include_onchain: false
  include_orderbook: false
  include_derivatives: true
  include_sentiment: false
  forward_fill_limit: 0
  fillna_value: 0.0

sentiment:
  use_sentiment: false
  sentiment_source: api
  sentiment_api_key: ""

models:
  directory: artifacts/models
  weights_glob: artifacts/backtest_acc_*.json
  use_gpu: true
  gpu_tree_method: gpu_hist
  max_models: 16
  random_seed: 1337

backtest:
  mode: holdout
  validation_fraction: 0.2
  walkforward_window_days: 30
  metrics:
    - accuracy
    - precision
    - recall
  p_up_threshold: 0.65
  position_size: 0.10
  max_leverage: 2.0
  max_trade_loss: 0.06
  max_trade_gain: 0.30
  compound: false

onchain:
  use_mempool: true
  use_exchange_flows: true
  use_usdt_events: true
  cache_dir: data/cache/onchain
  glassnode_api_key: null
  whale_api_key: null
  exchange_flow_source: csv
  exchange_flow_path: null
  request_timeout: 10
  request_retries: 5

cv:
  type: purged-wf
  embargo_min: 360
  n_splits: 5

calibration:
  method: isotonic

execution:
  fees_bps: 1.0
  slip_bps: 1.0
  latency_min: 1

horizons:
  - 240
  - 120
  - 360

pct_threshold: 0.005

derivatives:
  funding_source: null
  basis_source: null
  open_interest_source: null
  resample_freq: 5T

orderbook:
  depth_levels: 5

live_universe:
  - BTCUSDC
  - ETHUSDC
  - BNBUSDC
  - SOLUSDC
  - XRPUSDC

live_asset_limits:
  BTCUSDC:
    max_leverage: 50
    max_exposure_pct: 0.15
    fee_bps: 10
    slippage_bps: 10
  ETHUSDC:
    max_leverage: 50
    max_exposure_pct: 0.15
    fee_bps: 10
    slippage_bps: 10
  BNBUSDC:
    max_leverage: 25
    max_exposure_pct: 0.12
    fee_bps: 12
    slippage_bps: 12
  SOLUSDC:
    max_leverage: 25
    max_exposure_pct: 0.12
    fee_bps: 12
    slippage_bps: 12
  XRPUSDC:
    max_leverage: 20
    max_exposure_pct: 0.10
    fee_bps: 12
    slippage_bps: 12

live_initial_equity: 10000
live_initial_cash: 10000
live_position_size: 0.01
live_target_volatility: 0.02
live_min_position_size: 0.001
live_max_position_size: 0.05
